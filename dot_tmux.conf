# ============================================================
#  tmux 設定檔
#  重新載入：prefix + r，或 tmux source-file ~/.tmux.conf
# ============================================================

# ------------------------------------------------------------
#  Prefix 前綴鍵
# ------------------------------------------------------------

# 把前綴鍵改成反引號 `，比預設的 Ctrl-b 更好按（不用按組合鍵）
set -g prefix `

# 解除預設的 Ctrl-b，避免兩個前綴鍵並存
unbind C-b

# 連按兩次 `` 會送出一個真正的反引號字元到終端機
# 沒有這行的話就再也打不出 ` 了（例如 markdown 的程式碼區塊）
bind ` send-prefix

# ------------------------------------------------------------
#  一般行為
# ------------------------------------------------------------

# 啟用滑鼠：可點選切換 pane/window、拖曳邊界調整大小、滾輪捲動歷史
set -g mouse on

# 新開的 pane 使用你登入 shell（$SHELL，這台機器是 /usr/bin/zsh）
# 不設的話 tmux 會開成非登入 shell，可能讀不到 .zprofile 等設定
set -g default-command "${SHELL}"

# copy mode 用 vi 鍵位操作（hjkl 移動、/ 搜尋），而非預設的 emacs 鍵位
setw -g mode-keys vi

# ------------------------------------------------------------
#  Copy mode（複製模式，vi 風格）
# ------------------------------------------------------------

# v 開始選取（對應 vim 的 visual mode）
bind -T copy-mode-vi v send-keys -X begin-selection

# y 複製選取內容到 tmux buffer（對應 vim 的 yank）
bind -T copy-mode-vi y send-keys -X copy-selection

# 解除「滑鼠拖曳放開時自動複製並離開 copy mode」的預設行為。
# 放開滑鼠後會停留在 copy mode，方便用鍵盤微調選取範圍再按 y。
unbind -T copy-mode-vi MouseDragEnd1Pane

# ------------------------------------------------------------
#  分割 Pane
# ------------------------------------------------------------

# 解除預設的 " 和 %，改用下面更直觀的符號
unbind '"'
unbind %

# | 垂直分隔線 → 左右分割（符號長得像分割線本身）
bind | split-window -h

# - 水平分隔線 → 上下分割
bind - split-window -v

# ------------------------------------------------------------
#  調整 Pane 大小
# ------------------------------------------------------------
# -r 代表 repeatable：按一次 prefix 後可連續按 hjkl 微調，
# 不必每次都重按前綴鍵。每次調整 1 格，適合精細對齊。

bind -r h resize-pane -L 1
bind -r j resize-pane -D 1
bind -r k resize-pane -U 1
bind -r l resize-pane -R 1

# m = maximize，切換當前 pane 的全螢幕（zoom）狀態，再按一次還原
bind -r m resize-pane -Z

# ------------------------------------------------------------
#  設定檔重新載入
# ------------------------------------------------------------

# prefix + r 立即套用本檔案的修改，不需重啟 tmux
bind r source-file ~/.tmux.conf

# ------------------------------------------------------------
#  Catppuccin 主題（狀態列外觀）
# ------------------------------------------------------------
# 這些 @catppuccin_* 變數必須在下面 run 載入主題「之前」設定，
# 因為主題腳本是在載入當下讀取這些值來組出狀態列格式字串的。

# 每個 window 標籤左端的分隔符號（Nerd Font 私用區字元 U+E0B6，實心左半圓）
set -g @catppuccin_window_left_separator ""

# 標籤內文字與編號之間的分隔（一個空格 + 實心方塊）
set -g @catppuccin_window_middle_separator " █"

# window 編號顯示在標籤的右側
set -g @catppuccin_window_number_position "right"

# 每個 window 標籤右端的分隔符號（Nerd Font 私用區字元 U+E0B4，實心右半圓 + 空格）
# 註：原本這裡拼成 righ_separator（少一個 t），Catppuccin 讀不到而從未生效；
#     已於 2026-08-15 修正，所以標籤右端外觀會與先前不同。
set -g @catppuccin_window_right_separator " "

# 載入 Catppuccin 主題（macchiato 配色）。
# 注意它裝在 ~/.config/tmux/plugins/ 而不是 tpm 的 ~/.tmux/plugins/，
# 所以是手動 run 載入，不受下面 tpm 管理。
run '~/.config/tmux/plugins/catppuccin/catppuccin.tmux'

# ------------------------------------------------------------
#  Plugins（由 tpm 管理）
# ------------------------------------------------------------
# 操作：prefix + I 安裝、prefix + U 更新、prefix + Alt-u 清除未列出的套件

# tpm 本身，套件管理器
set -g @plugin 'tmux-plugins/tpm'

# 用 Ctrl-h/j/k/l 在 tmux pane 與 vim/neovim 分割視窗之間無縫切換，
# 會自動偵測當前 pane 是否跑著 vim 來決定按鍵要送給誰
set -g @plugin 'christoomey/vim-tmux-navigator'

# 手動存檔／還原 session：prefix + Ctrl-s 儲存、prefix + Ctrl-r 還原
set -g @plugin 'tmux-plugins/tmux-resurrect'

# 在 resurrect 之上自動化：定期自動存檔，並在 tmux 啟動時自動還原
set -g @plugin 'tmux-plugins/tmux-continuum'

# 存檔時連同各 pane 的畫面內容一起保存，還原後看得到之前的輸出
set -g @resurrect-capture-pane-contents 'on'

# tmux server 啟動時自動還原上次的 session（不必手動按 prefix + Ctrl-r）
set -g @continuum-restore 'on'

# 啟動 tpm —— 必須放在檔案「最後一行」，
# 它會依序載入上面宣告的所有套件，套件的設定要寫在這行之前才會生效
run '~/.tmux/plugins/tpm/tpm'
